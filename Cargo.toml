[workspace]
resolver = "3"
# Add "apps/*" once the first UI shell exists (an unmatched glob is an error).
members = ["crates/*"]
# Spikes are standalone throwaway workspaces with their own Cargo.lock.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Balls0fSteel/clawsmail-rust"
rust-version = "1.100"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
