[workspace]

[package]
name = "oauth-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
url = "2.5"
thiserror = "2"
webbrowser = "1.2"

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Credentials"] }
